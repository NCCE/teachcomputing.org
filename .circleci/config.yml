version: 2.1

orbs:
  ruby: circleci/ruby@1

jobs:
  brakeman:
    docker:
      - image: "cimg/ruby:3.3.11"
    steps:
      - checkout
      - ruby/install-deps
      - run:
          name: Inspecting with Brakeman
          command: bundle exec brakeman

  standardrb:
    docker:
      - image: "cimg/ruby:3.3.11"
    steps:
      - checkout
      - ruby/install-deps
      - run:
          name: Inspecting code with standardrb
          command: bundle exec standardrb

  test:
    resource_class: medium
    parallelism: 4
    working_directory: ~/teachcomputing
    docker:
      - image: cimg/ruby:3.3.11-browsers
        environment:
          BUNDLE_JOBS: "4"
          BUNDLE_RETRY: "3"
          BUNDLE_PATH: vendor/bundle
          CREDENTIALS_ENV: test
          DB_HOST: 127.0.0.1
          PGHOST: 127.0.0.1
          PGUSER: ncce_test
          RAILS_ENV: test
      - image: cimg/postgres:14.7
        environment:
          POSTGRES_USER: postgres
          POSTGRES_DB: ncce_test
          POSTGRES_PASSWORD: ""
    steps:
      - checkout
      - run:
          name: Which bundler?
          command: bundle -v
      - restore_cache:
          keys:
            - ncce-bundle-v2-{{ checksum "Gemfile.lock" }}
      - run:
          name: Bundle Install
          command: bundle check || bundle install
      - save_cache:
          key: ncce-bundle-v2-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle
      - restore_cache:
          name: Restore Yarn Package Cache
          keys:
            - yarn-packages-{{ checksum "yarn.lock" }}
      - run:
          name: Install Dependencies
          command: yarn install --immutable
      - save_cache:
          name: Save Yarn Package Cache
          key: yarn-packages-{{ checksum "yarn.lock" }}
          paths:
            - ~/.cache/yarn
      - run:
          name: Wait for DB
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
      - run:
          name: Database setup
          command: bin/rails db:schema:load --trace
      - run:
          name: Checksum Webpacker watched files
          command: find app/webpacker app/components app/views/fields config/webpack yarn.lock package.json -type f | sort | xargs sha1sum > /tmp/webpacker-checksum
      - restore_cache:
          name: Restore Webpacker Cache
          keys:
            - webpacker-test-v1-{{ checksum "/tmp/webpacker-checksum" }}
            - webpacker-test-v1-
      - run:
          name: Compile test assets
          # Matches the NODE_ENV bin/webpack defaults to when rails_helper compiles; skipped if the restored cache is fresh
          command: NODE_ENV=development bin/rails webpacker:compile
      - save_cache:
          name: Save Webpacker Cache
          key: webpacker-test-v1-{{ checksum "/tmp/webpacker-checksum" }}
          paths:
            - public/packs-test
            - tmp/cache/webpacker
      - run:
          name: Run rspec
          # Each parallel node runs a share of the spec files, balanced using timings from previous runs' stored test results
          command: |
            mkdir ~/rspec
            TEST_FILES=$(circleci tests glob "spec/**/*_spec.rb" | circleci tests split --split-by=timings)
            bundle exec rspec --format progress --format RspecJunitFormatter -o ~/rspec/rspec.xml $TEST_FILES
      - run:
          name: Stash coverage results for this node
          # Named per node so the 4 nodes' files don't collide in the workspace; the coverage job collates them
          command: |
            mkdir -p coverage_results
            cp coverage/.resultset.json coverage_results/node-${CIRCLE_NODE_INDEX}.json
      - persist_to_workspace:
          root: ~/teachcomputing
          paths:
            - coverage_results
      - store_test_results:
          path: ~/rspec
      - store_artifacts:
          path: tmp/screenshots

  coverage:
    # Same working_directory as test, as the stashed results record absolute paths to the source files
    working_directory: ~/teachcomputing
    docker:
      - image: cimg/ruby:3.3.11
        environment:
          BUNDLE_PATH: vendor/bundle
    steps:
      - checkout
      - attach_workspace:
          at: ~/teachcomputing
      - restore_cache:
          keys:
            - ncce-bundle-v2-{{ checksum "Gemfile.lock" }}
      - run:
          name: Bundle Install
          command: bundle check || bundle install
      - run:
          name: Collate coverage from all test nodes
          command: bundle exec ruby -e 'require "simplecov"; require "./spec/simplecov_profile"; SimpleCov.collate Dir["coverage_results/*.json"], "teachcomputing"'
      - store_artifacts:
          path: coverage

workflows:
  version: 2
  brakeman:
    jobs:
      - brakeman:
          filters:
            branches:
              ignore:
                - main

  standardrb:
    jobs:
      - standardrb:
          filters:
            branches:
              ignore:
                - main

  build_and_test:
    jobs:
      - test
      - coverage:
          requires:
            - test
